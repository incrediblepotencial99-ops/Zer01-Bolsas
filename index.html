<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FCFAF9" />
    <title>Aura - Sistema de Controle de Estoque</title>
    <meta name="description" content="Aura - Sistema inteligente e premium de controle de estoque de produtos com leitor de etiqueta por foto, controle financeiro, histórico de vendas e trocas." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Hanken+Grotesk:wght@700;800&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#FCD4E3",
                        "surface-dim": "#F7CADB",
                        "secondary-fixed-dim": "#FCA6C7",
                        "tertiary-fixed": "#F0E5E8",
                        "on-error-container": "#93000a",
                        "background": "#FCFAF9",
                        "on-primary-fixed-variant": "#5E464E",
                        "inverse-on-surface": "#FFF0F4",
                        "on-tertiary": "#ffffff",
                        "on-background": "#29141B",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#7D7074",
                        "surface-tint": "#B83A69",
                        "surface-variant": "#FCD4E3",
                        "secondary": "#D12D6C",
                        "outline-variant": "#F2E2E7",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#FDF5F8",
                        "primary": "#D12D6C",
                        "on-error": "#ffffff",
                        "outline": "#8E727C",
                        "surface": "#ffffff",
                        "on-secondary-container": "#ffffff",
                        "tertiary-container": "#2A181C",
                        "primary-fixed-dim": "#FCA6C7",
                        "on-tertiary-fixed-variant": "#58484B",
                        "secondary-container": "#FC5897",
                        "secondary-fixed": "#FCD4E3",
                        "on-tertiary-fixed": "#2A181C",
                        "inverse-primary": "#FCA6C7",
                        "surface-container": "#FCEEF3",
                        "primary-container": "#FFEBF2",
                        "inverse-surface": "#412D33",
                        "on-surface-variant": "#735A64",
                        "on-secondary-fixed-variant": "#B80E4D",
                        "on-surface": "#29141B",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#FCD4E3",
                        "surface-container-highest": "#FCD4E3",
                        "surface-bright": "#FCFAF9",
                        "tertiary": "#D12D6C",
                        "on-secondary-fixed": "#4E001C",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#3E0A1E",
                        "tertiary-fixed-dim": "#D8C9CC",
                        "on-primary-container": "#B83A69"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "1.25rem",
                        "margin-mobile": "1rem",
                        "stack-md": "1.5rem",
                        "gutter-md": "1rem",
                        "stack-sm": "0.5rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-price": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "26px", "fontWeight": "700" }],

                        "headline-lg": ["28px", { "lineHeight": "34px", "fontWeight": "800" }],
                        "display-price": ["32px", { "lineHeight": "40px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
  </head>
  <body class="bg-background text-on-background antialiased">
    <div id="root">
      <!-- Splash Screen visível enquanto o JS carrega (evita tela branca no mobile) -->
      <div id="splash-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#FCFAF9;font-family:Inter,sans-serif;">
        <div style="width:48px;height:48px;border:4px solid rgba(209,45,108,0.15);border-top-color:#D12D6C;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <h2 style="font-size:1.25rem;font-weight:800;color:#29141B;letter-spacing:0.15em;margin:0;">AURA</h2>
        <p style="font-size:0.85rem;color:#735A64;margin:0;">Carregando sistema...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
